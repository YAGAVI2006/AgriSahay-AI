server:
  port: 8080

spring:
  application:
    name: agrisahay-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:agrisahaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 Hours

gemini:
  api:
    key: ${GEMINI_API_KEY:demo_gemini_key}

openweather:
  api:
    key: ${OPENWEATHER_API_KEY:demo_openweather_key}
