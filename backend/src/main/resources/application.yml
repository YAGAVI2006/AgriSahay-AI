server:
  port: 8080

spring:
  application:
    name: agrisahay-backend
  datasource:
    url: jdbc:h2:mem:agrisahaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 Hours

gemini:
  api:
    key: ${GEMINI_API_KEY:demo_gemini_key}
